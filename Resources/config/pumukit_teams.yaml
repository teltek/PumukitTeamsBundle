services:
  _defaults:
    autowire:      true
    autoconfigure: true
    public:        true

  Pumukit\TeamsBundle\Controller\:
    resource: '../../Controller'
    tags: ['controller.service_arguments']

  Pumukit\TeamsBundle\Services\TokenValidator:
    arguments:
      $cache: '@pumukit_teams.cache'
      $clientId: '%pumukit_teams.client_id%'
      $tenants: '%pumukit_teams.tenants%'
      $jwksUri: '%pumukit_teams.jwks_uri%'

  Pumukit\TeamsBundle\Services\TeamsAuthenticator: ~

  Pumukit\TeamsBundle\Services\ImportService:
    arguments:
      $profile: '%pumukit_teams.profile%'
      $priority: '%pumukit_teams.priority%'
      $language: '%pumukit_teams.language%'
